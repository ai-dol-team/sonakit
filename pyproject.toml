[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sonakit"
version = "0.1.0"
description = "API-first reusable media capabilities for web applications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.123,<1",
  "fonttools>=4.63,<5",
  "gunicorn>=24,<25",
  "numpy>=2.3,<3",
  "opencv-python-headless>=4.13,<5",
  "pillow>=12,<13",
  "pydantic-settings>=2.12,<3",
  "python-multipart>=0.0.20,<1",
  "qrcode[pil]>=8.2,<9",
  "regex>=2025.11,<2027",
  "uvicorn[standard]>=0.38,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9,<10",
  "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sonakit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
